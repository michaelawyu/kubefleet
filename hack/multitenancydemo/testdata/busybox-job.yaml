apiVersion: batch/v1
kind: Job
metadata:
  name: busybox
  labels:
    kueue.x-k8s.io/queue-name: global
spec:
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: busybox
        image: busybox
        command:
        - sh
        - -c
        - echo "Hello from BusyBox"
  backoffLimit: 3
