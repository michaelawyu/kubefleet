apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
  annotations:
    kubefleet.dev/cluster-selectors-from-tenant: region=abc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        image: busybox
        command:
        - sh
        - -c
        - "while true; do sleep 3600; done"